# ==============================================================
# Render Blueprint — free-tier Node web service
# https://render.com/docs/blueprint-spec
# ==============================================================

services:
  - type: web
    name: arc-backend
    runtime: node
    plan: free
    branch: development
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # --- Database (paste your Neon connection string in the dashboard) ---
      - key: DATABASE_URL
        sync: false

      # --- Gemini API key ---
      - key: GEMINI_FREE_API_KEY
        sync: false

      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # --- Limits ---
      - key: FREE_TIER_DAILY_TOKEN_LIMIT
        value: "50000"

      # --- CORS (update if your frontend URL changes) ---
      - key: ALLOWED_ORIGINS
        value: https://arc-lime.vercel.app
        value: https://arc.baakhanfalcha.com
        value: http://localhost:3000

      # --- Neon Auth (optional) ---
      - key: USE_NEON_AUTH
        value: false
      - key: NEON_AUTH_JWKS_URL
        sync: false

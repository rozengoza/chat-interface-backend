# fly.toml app configuration file generated for chat-interface-backend on 2026-07-13T05:05:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chat-interface-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
